name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ hashFiles('**/Cargo.lock') }}
      - name: Run all tests
        run: cargo test
      - name: Clippy
        run: cargo clippy -- -D warnings

  check-windows:
    name: Check Windows TSF (cross)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install mingw cross-compiler
        run: sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: cargo check (windows-tsf)
        run: cargo check --package windows-tsf --target x86_64-pc-windows-gnu
      - name: clippy (windows-tsf)
        run: cargo clippy --package windows-tsf --target x86_64-pc-windows-gnu
